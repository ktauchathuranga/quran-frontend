<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: url('images/404.webp') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            backdrop-filter: blur(6px);
            overflow: hidden;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 7rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-shadow: 4px 4px 12px rgba(0, 0, 0, 0.4);
        }

        p {
            font-size: 1.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3);
        }

        .btn {
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #6a0dad;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #6a0dad;
            border-radius: 50px;
            text-decoration: none;
            transition: 0.3s ease;
            text-transform: uppercase;
        }

        .btn:hover {
            background: #6a0dad;
            color: white;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 5rem;
            }

            p {
                font-size: 1.2rem;
            }

            .btn {
                padding: 10px 20px;
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 4rem;
            }

            p {
                font-size: 1rem;
            }

            .btn {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Sorry, the page you are looking for does not exist or has been moved.</p>
        <a href="/" class="btn">Go Home</a>
    </div>
</body>
</html>
